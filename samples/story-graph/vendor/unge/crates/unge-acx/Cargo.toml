[package]
name = "unge-acx"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
unge-core = { path = "../unge-core" }
unge-executor = { path = "../unge-executor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
