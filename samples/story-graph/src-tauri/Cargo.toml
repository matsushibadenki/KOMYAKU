[package]
name = "komyaku-story-graph"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
unge-core = { path = "../vendor/unge/crates/unge-core" }
unge-executor = { path = "../vendor/unge/crates/unge-executor" }
unge-interaction = { path = "../vendor/unge/crates/unge-interaction" }
unge-render = { path = "../vendor/unge/crates/unge-render" }
unge-tauri = { path = "../vendor/unge/crates/unge-tauri" }
tauri = { version = "=2.11.6", features = ["unstable"] }
tauri-runtime-wry = "=2.11.4"
pollster = "0.4"
flate2 = "1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
ring = "0.17"
rfd = "=0.16.0"
svg2pdf = { version = "=0.13.0", default-features = false, features = ["text", "image"] }
pdf-writer = "=0.12.1"
unicode-segmentation = "=1.13.3"
rustybuzz = "=0.20.1"
unicode-vo = "=0.1.0"
tempfile = "3"
tokio = { version = "1", features = ["time", "sync", "macros"] }
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dev-dependencies]
lopdf = "=0.45.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSGraphics"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
raw-window-handle = "=0.6.2"
