services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: komyaku
      POSTGRES_USER: komyaku
      POSTGRES_PASSWORD: komyaku
    ports:
      - "5432:5432"
    volumes:
      - komyaku-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komyaku -d komyaku"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: komyaku
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - komyaku-minio:/data

volumes:
  komyaku-postgres:
  komyaku-minio:

