[package]
name = "komyaku"
version = "0.1.0"
description = "Multilingual document evolution platform"
authors = ["KOMYAKU contributors"]
edition = "2021"

[lib]
name = "komyaku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"
